[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hnova-video"
version = "0.2.0"
description = "Local procedural video and sound toolkit"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "imageio-ffmpeg>=0.6,<0.7"]

[project.optional-dependencies]
webgl = ["playwright>=1.49,<2"]

[project.scripts]
hvideo = "hvideo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hvideo = ["templates/*.json", "web/*.html", "web/*.js"]
